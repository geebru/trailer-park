services:
  trailarr-parrk:
    build: .
    container_name: trailarr-parrk
    networks:
      - emberdark
    volumes:
      - /mnt/user/data/media:/data/media
      - /mnt/user/appdata/trailarr-parrk/config:/config
    # Optional: expose the web UI on the Docker host.
    ports:
      - "8087:8080"
    restart: unless-stopped
    mem_limit: 4g

networks:
  emberdark:
    external: true
