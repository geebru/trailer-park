services:
  trailarr-parrk:
    build: .
    container_name: trailarr-parrk

    networks:
      - media-network

    volumes:
      - /path/to/media:/data/media
      - ./config:/config

    # Optional: run as a specific host UID:GID.
    # Check the correct values on your host with: id
    # user: "1000:1000"

    # Optional: expose the web UI on the Docker host.
    ports:
      - "8080:8080"

    restart: unless-stopped

networks:
  media-network:
    external: true
