# =====================================================================
# Trailarr Parrk — Configuration
# =====================================================================

# =====================================================================
# TMDB
# =====================================================================

# Your TMDB API key (v3 — short hex string from themoviedb.org/settings/api)
TMDB_API_KEY="your_tmdb_api_key_here"

# =====================================================================
# Behavior
# =====================================================================

# Set to true to log actions without downloading anything
DRY_RUN=false

# Set to true to re-download even if a trailer already exists
MANUAL_MODE=false

# =====================================================================
# Output Location
# =====================================================================

# Subdirectory name to place trailers in, relative to the media folder.
# Leave empty to save trailers directly into the media folder.
# Example: "trailers" → /media/Movie (2024)/trailers/Movie (2024).trailer.mkv
TRAILER_SUBDIR="trailers"

# Override the output filename (without extension). Leave empty to auto-generate.
# Auto-generated format: "Title (Year).trailer"
FILENAME_OVERRIDE=""

# =====================================================================
# Trailer Filtering
# =====================================================================

# Trailer name must contain at least one of these terms (case-insensitive).
# Leave empty to allow any trailer.
PREFERRED_TERMS=("official" "trailer")

# Trailers whose name contains any of these terms will be skipped (case-insensitive).
EXCLUDED_TERMS=("teaser" "clip" "reaction" "interview" "tv spot" "behind the scenes" "b&w" "fan" "fanmade")

# =====================================================================
# yt-dlp
# =====================================================================

# Path to a Netscape-format cookies file for yt-dlp (optional)
# Example: "/config/scripts/yt-cookies.txt"
YT_COOKIES=""

# =====================================================================
# TMDB Rate Limiting
# =====================================================================

# Maximum number of TMDB API calls allowed within the window below
MAX_CALLS=30

# Time window in seconds for the rate limit above
WINDOW_SECONDS=10

# =====================================================================
# Discord
# =====================================================================
 
# Webhook URL for download notifications. Leave empty to disable.
# Create one via: Server Settings → Integrations → Webhooks
DISCORD_WEBHOOK=""