name: Secret scan

# Looks for leaked credentials with TruffleHog. On a pull request it scans the commits the PR adds. Run by hand
# ("Run workflow") or called from the release workflow, it scans the whole history. A finding that is verified
# live, or that could not be verified, fails the run.
#
# The version input is the TruffleHog image. Keep it in step with the action tag; Dependabot only moves the tag.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request's commits
        if: ${{ github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.99.3
          extra_args: --results=verified,unknown

      - name: Scan the full history
        if: ${{ github.event_name != 'pull_request' }}
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          head: HEAD
          version: 3.99.3
          extra_args: --results=verified,unknown
