name: Release

# Keeps one open "release PR" that bumps the version and changelog from the Conventional Commit history on
# main. Merging that PR tags vX.Y.Z and creates the GitHub Release. Config: release-please-config.json.
#
# Tags and PRs made with the default GITHUB_TOKEN do not trigger other workflows, so anything that must run
# on a release has to be a job in this workflow, gated on the release output. When a release is created, the
# full history is scanned for secrets and then the multi-arch image is built, smoke tested and pushed to GHCR.
# The scan cannot stop the tag and GitHub Release (they are made in the first job); it stops the image.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  secret-scan:
    name: Secret scan
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/secrets-scan.yml

  image:
    name: Docker image
    needs: [release-please, secret-scan]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      major: ${{ needs.release-please.outputs.major }}
      minor: ${{ needs.release-please.outputs.minor }}
      patch: ${{ needs.release-please.outputs.patch }}
